[package]
name = "rust_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "rust_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Python bindings
pyo3 = { version = "0.21", features = ["extension-module"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Network/TCP
tokio = { version = "1.0", features = ["full"] }
async-std = { version = "1.12", features = ["attributes"] }

# S7 Protocol (quando disponibile)
# snap7-rs = "1.142"  # Da attivare quando il PLC sarà disponibile

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Thread-safe initialization
once_cell = "1.19"

